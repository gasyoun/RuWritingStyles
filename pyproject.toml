[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruwritingstyles"
version = "0.1.0"
description = "Agentic style review tooling for RuWritingStyles."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "RuWritingStyles contributors" }
]
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2",
  "python-dotenv>=1",
  "uvicorn>=0.30",
]

[project.scripts]
rws = "ruwritingstyles.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
