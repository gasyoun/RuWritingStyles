[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruwritingstyles"
version = "0.1.0"
description = "Agentic style review tooling for RuWritingStyles."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "RuWritingStyles contributors" }
]
dependencies = []

[project.scripts]
rws = "ruwritingstyles.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
