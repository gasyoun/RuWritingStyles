[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruwritingstyles"
version = "2.25.3"
description = "Agentic style review tooling for RuWritingStyles."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "M. Yu. Gasuns", email = "gasyoun@gmail.com" }
]
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2",
  "python-dotenv>=1",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "requests>=2.31",
  "websockets>=12.0",
]

[project.optional-dependencies]
# Test-only. FastAPI's TestClient (starlette) needs an httpx client lib;
# it is not used at runtime (the app uses requests/uvicorn).
test = [
  "httpx>=0.27",
  "pytest>=8",
]
# RCSI harvest lane (D19: the wave-0 winner enters as an optional extra, never
# a core dependency). The review pipeline itself keeps zero runtime deps.
harvest = [
  "pymupdf>=1.24",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "pdfminer.six>=20231228",
  "pypdf>=4",
]

[project.scripts]
rws = "ruwritingstyles.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
