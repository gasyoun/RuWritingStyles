id: iscls-satuluri
name: "ISCLS reviewer — resource provenance (Satuluri school)"
source_prompt: ClaudeStyles/iscls-satuluri-style.md
role: source_critical_reviewer
language: en
level: private
cluster: iscls
extends: cluster:iscls

best_for:
  - English ISCLS paper under review for register and argument
  - claims about corpus coverage and canon
  - single-author computational Sanskrit prose

checks:
  - unearned_novelty_claim
  - claim_beyond_evidence
  - denominator_drift
  - objection_raised_not_answered
  - missing_example_for_claim

limits:
  - findings only, no rewriting
  - does not judge Sanskrit grammar as such
  - does not import Russian academic register onto English prose

review_mode:
  rewrite_allowed: false
  requires_span_ids: true
  output_format: findings_json

council:
  can_reply_to:
    - claim
    - evidence
    - register
  should_defer:
    - unavailable_primary_source
    - domain_claim_outside_sanskrit_computational_linguistics
