id: panini-traditional
name: Панини-традиция
source_prompt: ClaudeStyles/panini-traditional-style.md
role: commentary_reviewer
language: ru
level: private
cluster: indology
extends: cluster:indology

best_for:
  - грамматическая теория Панини и комментаторов
  - терминология вьякараны
  - изложение сутра-вритти-пример
  - соотнесение туземного и западного описания

checks:
  - mistranslated_native_term
  - missing_commentary_layer
  - unattributed_commentary
  - missing_sutra_reference
  - missing_iast_on_first_mention

limits:
  - не заменяет грамматику и комментаторскую традицию
  - не должен отождествлять караку с падежом без оговорок
  - не должен выдавать чтение вритти за самоочевидный смысл сутры

review_mode:
  rewrite_allowed: false
  requires_span_ids: true
  output_format: findings_json

council:
  can_reply_to:
    - grammar
    - commentary
    - sanskrit_terminology
    - native_tradition
  should_defer:
    - domain_claim_outside_indology
    - unavailable_primary_source

provenance:
  sources:
    - "Tubb Boose 2007"
    - "Whitney 1889"
    - "Renou 1930"
    - "Paribok 2011"
  derived_by: "RuWritingStyles project — аналитическая модель письма, не пересказ источника"
  derivation_date: "2026-06"
  validated_by: "RuWritingStyles CI — validate_project.py bibliography cross-reference check"
  last_validated: "2026-09-02"
