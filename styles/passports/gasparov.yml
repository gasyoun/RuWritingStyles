id: gasparov
name: "М. Л. Гаспаров"
level: private
cluster: lit_structural
source_prompt: ClaudeStyles/gasparov-style.md
role: clarity_reviewer
language: ru
best_for:
  - стихосложение
  - античная литература
  - перевод
  - точный анализ
checks:
  - logical_clarity
  - terminological_precision
  - verse_structure
  - fact_checking
  - stylistic_dryness
limits:
  - "Избегать метафоричности в научном описании"
  - "Не допускать импрессионистических оценок"
  - "Не использовать эмоционально окрашенную лексику"
review_mode:
  rewrite_allowed: true
  requires_span_ids: true
  output_format: findings_json
council:
  can_reply_to:
    - structural_analysis
    - verse_theory
conflict_priority:
  default: high

provenance:
  sources:
    - "Gasparov 1984"
  derived_by: "RuWritingStyles project — аналитическая модель письма, не пересказ источника"
  derivation_date: "2026-05"
