id: cluster:lit_structural
name: "Структурная поэтика / МТШ-литературоведение"
level: cluster
extends: cluster:ling_mts
source_prompt: ClaudeStyles/lit-structural-cluster-base.md
role: cultural_context_reviewer
language: ru
best_for:
  - структура художественного текста
  - семиотика литературы
checks:
  - structural_imprecision
  - semiotic_blurring
markers:
  lexical:
    - "структура текста"
    - "художественное пространство"
    - "изоморфизм уровней"
forbidden_edits:
  - "Нельзя убирать схемы и таблицы структуры"
  - "Нельзя заменять «художественное время» на просто «время»"
review_mode:
  rewrite_allowed: false
  requires_span_ids: true
  output_format: findings_json
council:
  can_reply_to:
    - semiotics
    - structural_analysis
conflict_priority:
  default: medium
