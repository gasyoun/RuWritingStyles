id: cluster:lit_mythopoetics
name: "Мифопоэтическая школа"
level: cluster
extends: cluster:ling_mts
source_prompt: ClaudeStyles/lit-mythopoetics-cluster-base.md
role: cultural_context_reviewer
language: ru
best_for:
  - мифологема
  - архетип
  - сюжетная инвариантность
checks:
  - archetype_distortion
  - missing_mythic_context
markers:
  lexical:
    - "архетип"
    - "мифологема"
    - "инвариант сюжета"
    - "медиатор"
    - "бинарная оппозиция"
forbidden_edits:
  - "Нельзя убирать межкультурные параллели"
  - "Нельзя заменять «мифологема» на «образ»"
  - "Нельзя сокращать перечисления параллелей"
review_mode:
  rewrite_allowed: false
  requires_span_ids: true
  output_format: findings_json
council:
  can_reply_to:
    - cultural_context
    - structural_analysis
conflict_priority:
  default: medium
