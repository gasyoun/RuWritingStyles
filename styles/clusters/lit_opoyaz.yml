id: cluster:lit_opoyaz
name: "Формальная школа / ОПОЯЗ"
level: cluster
source_prompt: ClaudeStyles/lit-opoyaz-cluster-base.md
role: cultural_context_reviewer
language: ru
best_for:
  - теория приемов
  - материалистическая поэтика
  - остранение
checks:
  - psychologism_bias
  - material_distortion
markers:
  lexical:
    - "прием"
    - "остранение"
    - "автоматизация"
    - "конструктивный принцип"
forbidden_edits:
  - "Нельзя добавлять психологические объяснения поступков автора"
  - "Нельзя заменять «прием» на «средство»"
  - "Нельзя убирать «остранение»"
review_mode:
  rewrite_allowed: false
  requires_span_ids: true
  output_format: findings_json
council:
  can_reply_to:
    - structural_analysis
    - literary_theory
conflict_priority:
  default: medium
