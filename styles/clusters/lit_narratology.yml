id: cluster:lit_narratology
name: "Нарратологическая школа"
level: cluster
source_prompt: ClaudeStyles/lit-narratology-cluster-base.md
role: cultural_context_reviewer
language: ru
best_for:
  - нарратология
  - структура повествования
  - точка зрения
checks:
  - narrator_author_confusion
  - focalization_blurring
markers:
  lexical:
    - "нарратор"
    - "фокализатор"
    - "имплицитный автор"
    - "диегезис"
    - "фабула / сюжет"
forbidden_edits:
  - "Нельзя заменять «нарратор» на «автор»"
  - "Нельзя путать «фабулу» и «сюжет»"
  - "Нельзя убирать термин «фокализация»"
review_mode:
  rewrite_allowed: false
  requires_span_ids: true
  output_format: findings_json
council:
  can_reply_to:
    - structural_analysis
    - argument_structure
conflict_priority:
  default: medium
