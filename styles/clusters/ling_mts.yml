id: cluster:ling_mts
name: "Московско-Тартуская семиотическая школа (МТШ)"
level: cluster
source_prompt: ClaudeStyles/ling_mts-style.md
role: cultural_context_reviewer
language: ru
best_for:
  - семиотика
  - структурная поэтика
  - лингвокультурология
checks:
  - structural_inconsistency
  - semiotic_blurring
  - missing_contextual_link
markers:
  lexical:
    - "семиотическая система"
    - "код"
    - "текст культуры"
    - "бинарная оппозиция"
forbidden_edits:
  - "Нельзя упрощать структурные оппозиции"
  - "Нельзя заменять семиотические термины общеязыковыми"
review_mode:
  rewrite_allowed: false
  requires_span_ids: true
  output_format: findings_json
council:
  can_reply_to:
    - cultural_context
    - structural_analysis
conflict_priority:
  default: medium
  when_domain:
    - semiotics
    - literature
