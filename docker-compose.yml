version: '3.8'

services:
  ruwritingstyles:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./rws.db:/app/rws.db
      - ./runs:/app/runs
      - ./examples:/app/examples
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - RWS_PROVIDER_MAX_ATTEMPTS=5
    restart: always
