services:
  ruwritingstyles:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./rws-data:/data
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - NOUS_PORTAL_API_KEY=${NOUS_PORTAL_API_KEY}
      - RWS_OLLAMA_URL=${RWS_OLLAMA_URL}
      - RWS_OLLAMA_MODEL=${RWS_OLLAMA_MODEL}
      - RWS_LOCAL_LLM_URL=${RWS_LOCAL_LLM_URL}
      - RWS_LOCAL_LLM_MODEL=${RWS_LOCAL_LLM_MODEL}
      - RWS_PROVIDER_MAX_ATTEMPTS=5
    restart: always
