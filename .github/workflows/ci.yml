name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      plugin: ${{ steps.filter.outputs.plugin }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Detect changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            plugin:
              - 'obsidian-plugin/**'
              - '.github/workflows/ci.yml'

  python:
    name: Python and eval
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e .[test]

      - name: Compile Python files
        run: python -m compileall -q src tools tests

      - name: Validate repository
        run: python tools/validate_project.py

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Run committed mock eval regression
        run: python scripts/ci-eval-gate.py

  web:
    name: Web Studio
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Run web tests
        run: npm test

      - name: Lint Web Studio
        run: npm run lint

      - name: Build Web Studio
        run: npm run build

  plugin:
    name: Obsidian plugin
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: obsidian-plugin
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: obsidian-plugin/package-lock.json

      - name: Install plugin dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Run plugin parity tests
        run: npm test

  required:
    name: Required gate
    if: always()
    needs:
      - changes
      - python
      - web
      - plugin
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable gate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          WEB_RESULT: ${{ needs.web.result }}
          PLUGIN_RESULT: ${{ needs.plugin.result }}
        run: |
          test "$CHANGES_RESULT" = "success"
          test "$PYTHON_RESULT" = "success"
          test "$WEB_RESULT" = "success" -o "$WEB_RESULT" = "skipped"
          test "$PLUGIN_RESULT" = "success" -o "$PLUGIN_RESULT" = "skipped"
