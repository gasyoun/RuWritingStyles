name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .[test]

      - name: Compile Python files
        run: python -m compileall -q src tools tests

      - name: Validate repository
        run: python tools/validate_project.py

      - name: Run tests
        run: python -m unittest discover -s tests

  plugin:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: obsidian-plugin

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: obsidian-plugin/package-lock.json

      # Strict install from the lockfile — no --legacy-peer-deps escape hatch.
      # Fails on any peer-dependency conflict (e.g. an obsidian bump whose exact
      # @codemirror/* peers no longer match our pins) or an out-of-sync lockfile,
      # so a breaking dependabot bump is caught here instead of on main.
      - name: Install plugin deps (strict, from lockfile)
        run: npm ci

      # tsc type-check + esbuild bundle → main.js. Catches type/build regressions
      # (e.g. a typescript bump that turns deprecated tsconfig options into errors)
      # before they reach main.
      - name: Build plugin (tsc + esbuild)
        run: npm run build

      # Enforces TS↔Python parity of the deterministic checks (transliteration
      # linter + journal compliance): the tests compare the plugin's output to
      # golden fixtures regenerated from the Python engine.
      - name: Obsidian plugin parity tests (TS ↔ Python)
        run: npm test
