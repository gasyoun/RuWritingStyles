name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .[test]

      - name: Compile Python files
        run: python -m compileall -q src tools tests

      - name: Validate repository
        run: python tools/validate_project.py

      - name: Run tests
        run: python -m unittest discover -s tests

  plugin:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Enforces TS↔Python parity of the deterministic checks (transliteration
      # linter + journal compliance): the tests compare the plugin's output to
      # golden fixtures regenerated from the Python engine. Pure check — no install.
      - name: Obsidian plugin parity tests (TS ↔ Python)
        run: npm --prefix obsidian-plugin test
