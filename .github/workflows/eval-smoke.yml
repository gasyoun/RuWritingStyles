name: Eval Smoke

on:
  workflow_dispatch:
    inputs:
      suite_id:
        description: "Deterministic suite id"
        required: false
        default: "github-eval-smoke"

jobs:
  eval-smoke:
    runs-on: ubuntu-latest
    env:
      SUITE_ID: ${{ inputs.suite_id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run mock eval suite
        run: python -m ruwritingstyles.cli eval-suite --provider mock --suite-id "$SUITE_ID-baseline"
        env:
          PYTHONPATH: src

      - name: Run candidate mock eval suite with comparison
        run: python -m ruwritingstyles.cli eval-suite --provider mock --suite-id "$SUITE_ID" --compare-to "runs/$SUITE_ID-baseline"
        env:
          PYTHONPATH: src

      - name: Validate eval suite
        run: python -m ruwritingstyles.cli validate-eval-suite "runs/$SUITE_ID"
        env:
          PYTHONPATH: src

      - name: Validate eval comparison
        run: python -m ruwritingstyles.cli validate-eval-comparison "runs/$SUITE_ID/comparison.json"
        env:
          PYTHONPATH: src

      - name: Show eval status
        run: python -m ruwritingstyles.cli eval-status "runs/$SUITE_ID"
        env:
          PYTHONPATH: src

      - name: Show comparison status
        run: python -m ruwritingstyles.cli eval-status "runs/$SUITE_ID/comparison.json"
        env:
          PYTHONPATH: src

      - name: Export eval suite
        run: python -m ruwritingstyles.cli export-eval-suite "runs/$SUITE_ID"
        env:
          PYTHONPATH: src

      - name: Upload eval bundle
        uses: actions/upload-artifact@v4
        with:
          name: "${{ inputs.suite_id }}-bundle"
          path: "runs/${{ inputs.suite_id }}/${{ inputs.suite_id }}-bundle.zip"
