id: cluster:ling_tsh
name: "Типологическая Школа (ТШ)"
level: cluster
source_prompt: ClaudeStyles/ling_tsh-style.md
role: source_critical_reviewer
language: ru
best_for:
  - лингвистические универсалии
  - сравнительная типология
  - количественные данные
checks:
  - overgeneralization
  - missing_language_sample
markers:
  lexical:
    - "выборка языков"
    - "лингвистическая универсалия"
    - "если X, то Y"
forbidden_edits:
  - "Нельзя убирать количественные данные"
  - "Нельзя «исправлять» типологические термины на традиционные школьные"
review_mode:
  rewrite_allowed: false
  requires_span_ids: true
  output_format: findings_json
council:
  can_reply_to:
    - typology
    - evidence
conflict_priority:
  default: medium
