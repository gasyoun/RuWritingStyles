id: cluster:lit_historico_cultural
name: "Историко-культурная и компаративная школа"
level: cluster
source_prompt: ClaudeStyles/lit-historico-cultural-cluster-base.md
role: cultural_context_reviewer
language: ru
best_for:
  - исторический контекст
  - сравнительное литературоведение
  - культурная традиция
checks:
  - context_omission
  - weak_comparative_link
markers:
  lexical:
    - "историко-культурный контекст"
    - "жанровая традиция"
    - "культурный тип"
    - "компаративный анализ"
forbidden_edits:
  - "Нельзя убирать исторические экскурсы"
  - "Нельзя сокращать сноски"
review_mode:
  rewrite_allowed: false
  requires_span_ids: true
  output_format: findings_json
council:
  can_reply_to:
    - cultural_context
    - evidence
conflict_priority:
  default: medium
