id: cluster:ling_dss
name: "Диалектологически-Социолингвистическая Школа (ДСШ)"
level: cluster
source_prompt: ClaudeStyles/ling_dss-style.md
role: source_critical_reviewer
language: ru
best_for:
  - диалектология
  - социолингвистика
  - полевая работа
checks:
  - field_data_distortion
  - overgeneralization
markers:
  lexical:
    - "в данном говоре"
    - "информант"
    - "полевые данные"
forbidden_edits:
  - "Нельзя убирать фонетическую транскрипцию"
  - "Нельзя «исправлять» диалектные формы на литературные"
review_mode:
  rewrite_allowed: false
  requires_span_ids: true
  output_format: findings_json
council:
  can_reply_to:
    - dialectology
    - field_data
conflict_priority:
  default: high
