id: cluster:ling_iesh
name: "Историко-этимологическая школа (ИЭШ)"
level: cluster
source_prompt: ClaudeStyles/ling_iesh-style.md
role: source_critical_reviewer
language: ru
domains: ["etymology", "historical_linguistics"]
best_for:
  - этимология
  - история слов
  - сравнительно-историческое языкознание
checks:
  - unsupported_etymology
  - arbitrary_sound_change
  - accidental_similarity
  - weak_historical_inference
  - missing_source
limits:
  - не заменяет специализированные этимологические словари
  - не должен фантазировать о корнях без данных
markers:
  lexical:
    - "впервые фиксируется в"
    - "регулярные фонетические соответствия"
    - "историческая форма"
  epistemic:
    - "предположительно"
    - "возможно"
    - "по-видимому"
forbidden_edits:
  - "НИКОГДА нельзя убирать оговорки об этимологической неопределенности"
  - "Нельзя «уточнять» датировки без источника"
  - "Нельзя убирать транслитерацию или переводы"
anchors:
  - id: iesh_01
    description: "Наличие эпистемических маркеров осторожности"
    signal: "\\b(предположительно|по всей видимости|трудно утверждать)\\b"
    expected: found
review_mode:
  rewrite_allowed: false
  requires_span_ids: true
  output_format: findings_json
council:
  can_reply_to:
    - unsupported_etymology
    - missing_source
  should_defer:
    - factual_bibliography
conflict_priority:
  default: high
  when_domain:
    - etymology
    - historical_linguistics
