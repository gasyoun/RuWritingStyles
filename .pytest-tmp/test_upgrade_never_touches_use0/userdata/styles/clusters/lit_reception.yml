id: cluster:lit_reception
name: "Рецептивная эстетика и теория читателя"
level: cluster
source_prompt: ClaudeStyles/lit-reception-cluster-base.md
role: cultural_context_reviewer
language: ru
best_for:
  - рецепция
  - теория читателя
  - горизонт ожиданий
checks:
  - reader_perspective_distortion
  - reception_gap
markers:
  lexical:
    - "имплицитный читатель"
    - "горизонт ожиданий"
    - "рецепция"
    - "стратегия текста"
forbidden_edits:
  - "Нельзя заменять «горизонт ожиданий» на «читательские ожидания»"
review_mode:
  rewrite_allowed: false
  requires_span_ids: true
  output_format: findings_json
council:
  can_reply_to:
    - cultural_context
    - semantic_interpretation
conflict_priority:
  default: medium
