id: cluster:lit_poststructural
name: "Постструктуралистская и деконструктивистская критика"
level: cluster
source_prompt: ClaudeStyles/lit-poststructural-cluster-base.md
role: cultural_context_reviewer
language: ru
best_for:
  - деконструкция
  - постструктурализм
  - логоцентризм
checks:
  - game_rhetoric_flattening
  - terminology_simplification
markers:
  lexical:
    - "деконструкция"
    - "след"
    - "différance"
    - "письмо"
    - "логоцентризм"
forbidden_edits:
  - "Нельзя исправлять différance на différence"
  - "Нельзя добавлять дефиниции авторских терминов"
  - "Нельзя «упрощать» стиль"
review_mode:
  rewrite_allowed: false
  requires_span_ids: true
  output_format: findings_json
council:
  can_reply_to:
    - cultural_context
    - style_overreach
conflict_priority:
  default: low
