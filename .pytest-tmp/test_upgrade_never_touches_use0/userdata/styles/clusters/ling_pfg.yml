id: cluster:ling_pfg
name: "Петербургская Функциональная Грамматика (ПФГ)"
level: cluster
source_prompt: ClaudeStyles/ling_pfg-style.md
role: systematic_grammar_reviewer
language: ru
best_for:
  - функциональная грамматика
  - полевая структура языка
  - центр и периферия
checks:
  - weak_classification
  - missing_field_boundary
markers:
  lexical:
    - "функционально-семантическое поле"
    - "центр / периферия"
    - "мы исходим из"
forbidden_edits:
  - "Нельзя убирать классификационные деления"
  - "Нельзя заменять «поле» на «класс» без объяснения"
review_mode:
  rewrite_allowed: false
  requires_span_ids: true
  output_format: findings_json
council:
  can_reply_to:
    - classification
    - grammar
conflict_priority:
  default: medium
